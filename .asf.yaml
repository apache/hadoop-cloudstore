# The format of this file is documented at
# https://github.com/apache/infrastructure-asfyaml/blob/main/README.md


project:
  metadata:
    key: hadoop-cloudstore
    committee: hadoop
    name: Apache Hadoop Cloudstore Tool
    description: Cloudstore is a JAR file containing diagnostics entry points for use with the hadoop CLI, intended to help debug connectivity, authentication and performance issues with cloud storage.
    short_description: Cloudstore provides hadoop cloud storage diagnostics and other utility commands.
    homepage: https://hadoop.apache.org/
    #lifecycle_page: https://tooling.apache.org/trusted-releases.html
    download_page: https://hadoop.apache.org/releases.html
    bug_database: https://issues.apache.org/jira/browse/
    mailing_lists: https://hadoop.apache.org/mailing_lists.html
    security_contact: security@hadoop.apache.org
    threat_model_link: https://github.com/apache/hadoop-cloudstore/security/policy
    threat_model_src_link: https://github.com/apache/hadoop-cloudstore/blob/main/SECURITY.md
    repositories:
      - git@github.com:apache/hadoop-cloudstore.git
    categories:
      - hadoop
      - cloud-storage
      - diagnostics
    programming_languages:
      - java
    version_method: simple
    version_pattern: '^\d+\.\d+$'
    cycle_match: '^(\d+)\.\d+$'
  policy:
    vote_mode: email
    min_hours: 72
    license_check_mode: RAT
    vote_recipients:
      to: common-dev@hadoop.apache.org
    announce_recipients:
      to: general@hadoop.apache.org
  features:
    atr_sync: true

notifications:
  commits:      common-commits@hadoop.apache.org
  issues:       common-issues@hadoop.apache.org
  pullrequests: common-issues@hadoop.apache.org
  jira_options: comment link label

github:
  description: "Apache Hadoop Cloudstore Tool"
  homepage: https://hadoop.apache.org/
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
    # default commit message when merging with a squash commit
    # can either be: DEFAULT | PR_TITLE | PR_TITLE_AND_COMMIT_DETAILS | PR_TITLE_AND_DESC
    squash_commit_message: PR_TITLE
  autolink_jira:
    - HADOOP
  # Projects can enable and disable Dependabot alerts and automatic security update pull requests:
  # this is on experimentally, we don't want to update hadoop because we want
  # to pin versions down
  dependabot_alerts:  false
  dependabot_updates: false
  copilot_code_review:
      enabled: true
      review_drafts: false
      review_on_push: true

  pull_requests:
    # auto-delete head branches after being merged
    del_branch_on_merge: true
  # see https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
  protected_branches:
    # main is locked down
    main:
      required_status_checks:
        # strict means "Require branches to be up to date before merging".
        strict: false
        # contexts are the names of checks that must pass.
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_last_push_approval: false
        # commit then review OK for now
        required_approving_review_count: 0

      # squash or rebase must be allowed in the repo for this setting to be set to true.
      required_linear_history: true

      # gh merge signs; manual commits need committers to set up git commit signing.
      required_signatures: false

      # requires all conversations to be resolved before merging is possible
      required_conversation_resolution: false


features:
  wiki: false
  issues: true
  projects: false

